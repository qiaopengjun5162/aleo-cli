[package]
name = "aleo-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Aleo blockchain — balance checks, private/public transfers, and network queries"

[dependencies]
aleo-rust-sdk = "0.2.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }
snarkvm = { version = "4.10.0", default-features = true, features = [
    "ledger",
    "synthesizer",
] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
